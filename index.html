<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf5ea" />
    <meta name="description" content="沸点火锅点单与门店履约概念演示，非官方产品" />
    <title>沸点 · 火锅点单概念演示</title>
    <script>
      (function () {
        // 同步设置初始语言到 html lang 属性
        try {
          var lang = localStorage.getItem('i18nextLng');
          document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-CN';
        } catch (e) {
          // localStorage 不可用时保持默认中文
        }
        // 挂载前设置 dark class，防止首屏闪烁（FOUC）
        try {
          var theme = localStorage.getItem('theme-mode');
          var shouldDark = false;
          if (theme === 'dark') shouldDark = true;
          else if (theme === 'light') shouldDark = false;
          else shouldDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (shouldDark) document.documentElement.classList.add('dark');
        } catch (e) { /* localStorage 不可用时默认浅色 */ }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
